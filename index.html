<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spine 2D Portfolio</title>
  
  <!-- Spine 3.8 공식 호스팅 CDN (가장 안정적) -->
  <link rel="stylesheet" href="https://esotericsoftware.com/files/spine-player/3.8/spine-player.css">
  <script src="https://esotericsoftware.com/files/spine-player/3.8/spine-player.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0f12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    header p {
      color: #8a8f9d;
      font-size: 0.95rem;
    }

    /* Spine Player 컨테이너 카드 */
    .player-card {
      width: 100%;
      max-width: 900px;
      height: 600px;
      background: #161920;
      border: 1px solid #282c37;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    #spine-player {
      width: 100%;
      height: 100%;
    }

    footer {
      margin-top: 24px;
      color: #525866;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>2D Character Animation</h1>
    <p>Spine 2D v3.8 Interactive Web Player</p>
  </header>

  <div class="player-card">
    <div id="spine-player"></div>
  </div>

  <footer>
    &copy; Portfolio. Powered by Spine Web Player 3.8.
  </footer>

  <script>
    window.addEventListener("DOMContentLoaded", function() {
      try {
        new spine.SpinePlayer("spine-player", {
          jsonUrl: "./c1085.json",     /* 경로를 ./c1085.json 으로 명시 */
          atlasUrl: "./c1085.atlas",   /* 경로를 ./c1085.atlas 로 명시 */
          backgroundColor: "#00000000",
          alpha: true,
          showControls: true,
          success: function(player) {
            console.log("Spine 로드 성공!");
          },
          error: function(player, reason) {
            console.error("Spine 로드 실패 이유:", reason);
          }
        });
      } catch (err) {
        console.error("Spine 실행 실패:", err);
      }
    });
  </script>

</body>
</html>
