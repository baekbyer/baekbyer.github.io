<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나의 스파인 포트폴리오</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        /* 플레이어가 들어갈 영역 크기 지정 */
        #player-container {
            width: 800px;
            height: 600px;
        }
    </style>
    
    <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2.*/dist/spine-player.css">
    <script src="https://unpkg.com/@esotericsoftware/spine-player@4.2.*/dist/spine-player.js"></script>
</head>
<body>

    <div id="player-container"></div>

    <script>
        // 3. SpinePlayer 객체 생성 및 설정
        new spine.SpinePlayer("player-container", {
            jsonUrl: "skeleton.json",   // 본인의 json 파일 경로
            atlasUrl: "skeleton.atlas", // 본인의 atlas 파일 경로
            animation: "idle",          // 처음에 재생할 애니메이션 이름 (스파인에서 지정한 애니메이션 명)
            alpha: true,                // 배경 투명도 설정 (필요에 따라 true/false)
            showControls: true,         // 재생/일시정지 등의 UI 컨트롤러 표시 여부
            viewport: {
                padLeft: "10%",
                padRight: "10%",
                padTop: "10%",
                padBottom: "10%"
            }
        });
    </script>

</body>
</html>
