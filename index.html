<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Spine Portfolio</title>

    <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/spine-player.css">

            background-color: #121212;
            display: flex;
            justify-content: center;

        #player {

            height: 80vh;
        }
    </style>
</head>
<body>

<div id="player"></div>

<script>
    new spine.SpinePlayer("player", {

        alpha: true
    });
