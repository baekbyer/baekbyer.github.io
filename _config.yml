<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Spine Animation Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 왼쪽 프레임 (메뉴 영역) */
        .sidebar {
            width: 300px;
            background-color: #1e1e1e;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
        }
        .sidebar h2 {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .menu-btn {
            background: transparent;
            border: none;
            color: #a0a0a0;
            text-align: left;
            padding: 12px 16px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .menu-btn:hover {
            background-color: #2a2a2a;
            color: #ffffff;
        }
        .menu-btn.active {
            background-color: #3b82f6;
            color: #ffffff;
            font-weight: bold;
        }

        /* 오른쪽 프레임 (갤러리 컨텐츠 영역) */
        .content-area {
            flex: 1;
            background-color: #181818;
            display: flex;
            justify-content: center;
            align-이민: center;
            align-items: center;
            position: relative;
            padding: 40px;
        }
        .gallery-panel {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .gallery-panel.active {
            display: flex;
        }

        /* 스파인 플레이어가 들어갈 컨테이너 */
        .spine-container {
            width: 100%;
            max-width: 800px;
            height: 550px;
            background-color: #1a1a1a;
            border-radius: 12px;
            border: 1px solid #333;
            overflow: hidden;
            position: relative;
        }
        .image-desc {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #ccc;
        }
    </style>

    <!-- Spine Web Player 공식 CSS 및 JS 불러오기 -->
    <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2.*/dist/spine-player.css">
    <script src="https://unpkg.com/@esotericsoftware/spine-player@4.2.*/dist/spine-player.js"></script>
</head>
<body>

    <!-- 왼쪽 프레임: 메뉴 영역 -->
    <aside class="sidebar">
        <h2>PORTFOLIO</h2>
        <div class="menu-list">
            <button class="menu-btn active" onclick="switchGallery('work1', event)">캐릭터 작업 A</button>
            <button class="menu-btn" onclick="switchGallery('work2', event)">캐릭터 작업 B</button>
        </div>
    </aside>

    <!-- 오른쪽 프레임: 갤러리 영역 -->
    <main class="content-area">
        <!-- 1번 작품 패널 -->
        <div id="work1" class="gallery-panel active">
            <div class="spine-container" id="player-container-1"></div>
            <p class="image-desc">캐릭터 A - 대기 및 스킬 모션</p>
        </div>

        <!-- 2번 작품 패널 -->
        <div id="work2" class="gallery-panel">
            <div class="spine-container" id="player-container-2"></div>
            <p class="image-desc">캐릭터 B - 전투 및 피격 모션</p>
        </div>
    </main>

    <script>
        // 1번 스파인 플레이어 초기화
        new spine.SpinePlayer("player-container-1", {
            jsonUrl: "skeleton1.json",   // 본인의 첫 번째 json 파일 경로
            atlasUrl: "skeleton1.atlas", // 본인의 첫 번째 atlas 파일 경로
            animation: "idle",          // 재생할 애니메이션 이름
            alpha: true,
            showControls: true,         // 재생/일시정지 컨트롤러 표시
            viewport: { padLeft: "10%", padRight: "10%", padTop: "10%", padBottom: "10%" }
        });

        // 2번 스파인 플레이어 초기화
        new spine.SpinePlayer("player-container-2", {
            jsonUrl: "skeleton2.json",   // 본인의 두 번째 json 파일 경로
            atlasUrl: "skeleton2.atlas", // 본인의 두 번째 atlas 파일 경로
            animation: "idle",
            alpha: true,
            showControls: true,
            viewport: { padLeft: "10%", padRight: "10%", padTop: "10%", padBottom: "10%" }
        });

        // 메뉴 클릭 시 탭 전환 함수
        function switchGallery(targetId, event) {
            const panels = document.querySelectorAll('.gallery-panel');
            panels.forEach(panel => panel.classList.remove('active'));

            const buttons = document.querySelectorAll('.menu-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            document.getElementById(targetId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>

</body>
</html>
