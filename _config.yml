<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Spine Animation Portfolio</title>
    <style>
        /* 전체 레이아웃 초기화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 왼쪽 프레임 (메뉴 영역) */
        .sidebar {
            width: 300px;
            background-color: #1e1e1e;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
        }
        .sidebar h2 {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .menu-btn {
            background: transparent;
            border: none;
            color: #a0a0a0;
            text-align: left;
            padding: 12px 16px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .menu-btn:hover {
            background-color: #2a2a2a;
            color: #ffffff;
        }
        /* 활성화된 버튼 스타일 */
        .menu-btn.active {
            background-color: #3b82f6;
            color: #ffffff;
            font-weight: bold;
        }

        /* 오른쪽 프레임 (갤러리 컨텐츠 영역) */
        .content-area {
            flex: 1;
            background-color: #181818;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 40px;
        }
        .gallery-panel {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease-in-out;
        }
        /* 활성화된 패널만 보이도록 설정 */
        .gallery-panel.active {
            display: flex;
        }

        /* 이미지 또는 스파인 플레이어 대체 박스 스타일 */
        .image-container {
            width: 100%;
            max-width: 800px;
            height: 500px;
            background-color: #222;
            border-radius: 12px;
            border: 1px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 비율 유지하며 꽉 채우기 */
        }
        .image-desc {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #ccc;
        }

        /* 페이드인 애니메이션 효과 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 왼쪽 프레임: 메뉴 영역 -->
    <aside class="sidebar">
        <h2>PORTFOLIO</h2>
        <div class="menu-list">
            <!-- 버튼의 data-target이 오른쪽 패널의 id와 연결됩니다 -->
            <button class="menu-btn active" onclick="switchGallery('work1', event)">캐릭터 작업 A</button>
            <button class="menu-btn" onclick="switchGallery('work2', event)">캐릭터 작업 B</button>
            <button class="menu-btn" onclick="switchGallery('work3', event)">UI 이펙트 모음</button>
        </div>
    </aside>

    <!-- 오른쪽 프레임: 갤러리 영역 -->
    <main class="content-area">
        <!-- 1번 작품 패널 -->
        <div id="work1" class="gallery-panel active">
            <div class="image-container">
                <!-- 이미지 경로를 본인의 이미지나 나중에 Spine Web Player div로 교체하세요 -->
                <script
	src="/spine-webcomponents.min.js"
></script>

<spine-skeleton
	atlas="spineboy-pma.atlas"
	skeleton="spineboy-pro.json"
	animation="walk"
></spine-skeleton>
            </div>
            <p class="image-desc">캐릭터 A - 대기 및 전투 모션 애니메이션</p>
        </div>

        <!-- 2번 작품 패널 -->
        <div id="work2" class="gallery-panel">
            <div class="image-container">
                <img src="https://picsum.photos/800/500?random=2" alt="작업물 B">
            </div>
            <p class="image-desc">캐릭터 B - 스킬 시전 이펙트 및 파츠 분리 작업</p>
        </div>

        <!-- 3번 작품 패널 -->
        <div id="work3" class="gallery-panel">
            <div class="image-container">
                <img src="https://picsum.photos/800/500?random=3" alt="작업물 C">
            </div>
            <p class="image-desc">UI 이펙트 - 로비 화면 및 아이콘 루프 애니메이션</p>
        </div>
    </main>

    <script>
        // 메뉴 클릭 시 해당 갤러리 패널을 보여주는 함수
        function switchGallery(targetId, event) {
            // 1. 모든 패널의 active 클래스 제거
            const panels = document.querySelectorAll('.gallery-panel');
            panels.forEach(panel => panel.classList.remove('active'));

            // 2. 모든 버튼의 active 클래스 제거
            const buttons = document.querySelectorAll('.menu-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            // 3. 선택한 타겟 패널에 active 클래스 추가하여 화면에 표시
            document.getElementById(targetId).classList.add('active');

            // 4. 클릭한 버튼에 active 클래스 추가 (선택된 효과)
            event.currentTarget.classList.add('active');
        }
    </script>

</body>
</html>
